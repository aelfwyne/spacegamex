[package]
name = "colonia-galactica"
version = "0.4.0"
edition = "2024"
description = "Colonia Galactica — spaceship survival and colony building"
default-run = "colonia-galactica"

[lib]
name = "colonia_galactica"
path = "src/lib.rs"

# Windowed game (eframe/egui: Wayland + X11 on Linux, Win32 on Windows).
[[bin]]
name = "colonia-galactica"
path = "src/bin/colonia-galactica.rs"

# Headless balance simulator (console tool, used by the regression sweep).
[[bin]]
name = "colonia-galactica-sim"
path = "src/bin/colonia-galactica-sim.rs"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]
# egui is slow unoptimised; keep our own crate debuggable.
opt-level = 2
